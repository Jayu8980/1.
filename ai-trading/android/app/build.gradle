plugins {
    id "com.android.application"
}

def versionNameValue = System.getenv("APP_VERSION_NAME") ?: "1.0.0"
def versionCodeValue = (System.getenv("APP_VERSION_CODE") ?: "1") as int

android {
    namespace "com.aitrading.desk"
    compileSdk 36

    defaultConfig {
        applicationId "com.aitrading.desk"
        minSdk 26
        targetSdk 36
        versionCode versionCodeValue
        versionName versionNameValue
    }

    signingConfigs {
        release {
            // CI can supply its own key through environment variables; otherwise the repository's
            // sideload key is used so that new builds install over old ones.
            storeFile file(System.getenv("SIGNING_STORE_FILE") ?: "sideload.keystore")
            storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: "aitrading-sideload"
            keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: "aitrading"
            keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: "aitrading-sideload"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.core:core:1.16.0"
    implementation "androidx.webkit:webkit:1.14.0"
}
