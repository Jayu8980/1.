<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoxForge Studio</title>
  <meta name="description" content="AI-style singing voice synthesis studio in the browser: piano roll, lyrics, virtual singers, parameter curves, multitrack mixing and export.">
  <meta name="theme-color" content="#14141c">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand"><img src="icons/icon.svg" alt=""><span>VoxForge</span></div>
    <nav id="menubar">
      <div class="menu" data-menu="file"><button>File</button>
        <div class="dropdown">
          <button data-cmd="new">New Project<kbd>Ctrl+Alt+N</kbd></button>
          <button data-cmd="demo">Load Demo Song</button>
          <button data-cmd="open">Open Project…<kbd>Ctrl+O</kbd></button>
          <button data-cmd="save">Save Project<kbd>Ctrl+S</kbd></button>
          <hr>
          <button data-cmd="importMidi">Import MIDI…</button>
          <button data-cmd="importAudio">Import Audio…</button>
          <hr>
          <button data-cmd="exportMidi">Export MIDI</button>
          <button data-cmd="exportWav">Export Mix (WAV)<kbd>Ctrl+E</kbd></button>
          <button data-cmd="exportStem">Export Active Track (WAV)</button>
        </div>
      </div>
      <div class="menu" data-menu="edit"><button>Edit</button>
        <div class="dropdown">
          <button data-cmd="undo">Undo<kbd>Ctrl+Z</kbd></button>
          <button data-cmd="redo">Redo<kbd>Ctrl+Shift+Z</kbd></button>
          <hr>
          <button data-cmd="cut">Cut<kbd>Ctrl+X</kbd></button>
          <button data-cmd="copy">Copy<kbd>Ctrl+C</kbd></button>
          <button data-cmd="paste">Paste at Playhead<kbd>Ctrl+V</kbd></button>
          <button data-cmd="duplicate">Duplicate<kbd>Ctrl+D</kbd></button>
          <button data-cmd="delete">Delete<kbd>Del</kbd></button>
          <hr>
          <button data-cmd="selectAll">Select All<kbd>Ctrl+A</kbd></button>
          <button data-cmd="deselect">Deselect<kbd>Esc</kbd></button>
        </div>
      </div>
      <div class="menu" data-menu="track"><button>Track</button>
        <div class="dropdown">
          <button data-cmd="addVocal">Add Vocal Track</button>
          <button data-cmd="addInstrument">Add Instrument Track</button>
          <button data-cmd="addAudio">Add Audio Track</button>
          <hr>
          <button data-cmd="dupTrack">Duplicate Track</button>
          <button data-cmd="delTrack">Delete Track</button>
        </div>
      </div>
      <div class="menu" data-menu="tools"><button>AI Tools</button>
        <div class="dropdown">
          <button data-cmd="lyrics">Enter Lyrics…<kbd>Ctrl+L</kbd></button>
          <button data-cmd="harmony">Generate Harmony…</button>
          <button data-cmd="humanize">Humanize Timing &amp; Dynamics</button>
          <button data-cmd="quantize">Quantize to Grid<kbd>Q</kbd></button>
          <button data-cmd="legato">Make Legato</button>
          <button data-cmd="fitScale">Snap Notes to Key</button>
          <button data-cmd="autoBreath">Auto Breath &amp; Dynamics</button>
          <button data-cmd="clearParams">Reset Parameter Curves</button>
        </div>
      </div>
      <div class="menu" data-menu="view"><button>View</button>
        <div class="dropdown">
          <button data-cmd="togglePitch">Show Pitch Curve<span class="check" data-check="showPitch"></span></button>
          <button data-cmd="toggleGhosts">Show Other Tracks<span class="check" data-check="showGhosts"></span></button>
          <button data-cmd="toggleFollow">Follow Playhead<span class="check" data-check="follow"></span></button>
          <hr>
          <button data-cmd="zoomIn">Zoom In<kbd>Ctrl+=</kbd></button>
          <button data-cmd="zoomOut">Zoom Out<kbd>Ctrl+-</kbd></button>
          <button data-cmd="zoomFit">Zoom to Notes<kbd>F</kbd></button>
        </div>
      </div>
      <div class="menu" data-menu="help"><button>Help</button>
        <div class="dropdown">
          <button data-cmd="shortcuts">Keyboard Shortcuts<kbd>?</kbd></button>
          <button data-cmd="about">About</button>
        </div>
      </div>
    </nav>

    <div class="transport">
      <button id="btnHome" title="Go to start (Home)"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM9.5 12 18 5v14z"/></svg></button>
      <button id="btnPlay" class="play" title="Play / Pause (Space)"><svg viewBox="0 0 24 24" class="i-play"><path d="M7 5v14l12-7z"/></svg><svg viewBox="0 0 24 24" class="i-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
      <button id="btnStop" title="Stop"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
      <button id="btnLoop" class="toggle" title="Loop (L)"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
      <button id="btnMetro" class="toggle" title="Metronome (M)"><svg viewBox="0 0 24 24"><path d="M10 2h4l4 18H6zm1.5 4-1 5h3l-1-5zM12 13l5-6 1 1-5 6z"/></svg></button>
      <div class="lcd"><span id="posBars">1.1.000</span><span id="posTime">00:00.000</span></div>
      <label class="field">BPM<input id="bpm" type="number" min="30" max="300" step="1"></label>
      <label class="field">Sig<select id="timeSig"><option>4/4</option><option>3/4</option><option>6/8</option><option>2/4</option><option>5/4</option></select></label>
    </div>

    <div class="tools">
      <div class="seg" id="toolSeg">
        <button data-tool="select" title="Select (1)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L16 20l-2.5 1-3-7.5L6 18z"/></svg></button>
        <button data-tool="draw" title="Draw notes (2)"><svg viewBox="0 0 24 24"><path d="M3 17.2V21h3.8l11-11-3.8-3.8zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.8 3.8z"/></svg></button>
        <button data-tool="erase" title="Erase (3)"><svg viewBox="0 0 24 24"><path d="M16.2 3.6 21 8.4a2 2 0 0 1 0 2.8L12 20h8v2H8l-5-5a2 2 0 0 1 0-2.8L13.4 3.6a2 2 0 0 1 2.8 0zM5 15.6l3.4 3.4h3.2l3-3-4.8-4.8z"/></svg></button>
        <button data-tool="split" title="Split notes (4)"><svg viewBox="0 0 24 24"><path d="M11 2h2v20h-2zM4 8h5v8H4zm11 0h5v8h-5z"/></svg></button>
      </div>
      <label class="field">Snap<select id="snap">
        <option value="1920">1 bar</option><option value="960">1/2</option><option value="480">1/4</option>
        <option value="240">1/8</option><option value="160">1/8T</option><option value="120">1/16</option>
        <option value="60">1/32</option><option value="1">Off</option></select></label>
    </div>
    <div class="spacer"></div>
    <div id="projName" contenteditable="true" spellcheck="false" title="Project name"></div>
  </header>

  <main id="main">
    <section id="center">
      <div id="arrangeWrap">
        <div id="trackHeaders">
          <div class="th-top"><span>Tracks</span>
            <div class="add-track">
              <button data-cmd="addVocal" title="Add vocal track">+ Vocal</button>
              <button data-cmd="addInstrument" title="Add instrument track">+ Inst</button>
              <button data-cmd="addAudio" title="Add audio track">+ Audio</button>
            </div>
          </div>
          <div id="trackList"></div>
        </div>
        <div id="arrangeCanvasWrap"><canvas id="arrangeCanvas"></canvas></div>
      </div>
      <div class="splitter" data-split="arrange"></div>
      <div id="rollWrap">
        <canvas id="rollCanvas" tabindex="0"></canvas>
        <input id="lyricEditor" type="text" spellcheck="false" autocomplete="off">
        <div id="rollEmpty" class="hint-overlay"></div>
      </div>
      <div class="splitter" data-split="param"></div>
      <div id="paramWrap">
        <div id="paramTabs"></div>
        <canvas id="paramCanvas"></canvas>
      </div>
      <div id="hscroll"><div id="hscrollInner"></div></div>
    </section>
    <aside id="inspector"></aside>
  </main>

  <footer id="statusbar">
    <span id="statusMsg">Ready</span>
    <span class="spacer"></span>
    <span id="statusSel"></span>
    <span id="statusZoom"></span>
    <span id="statusAudio">Audio: idle</span>
  </footer>

  <div id="ctxMenu" class="ctx-menu"></div>
  <div id="modalRoot"></div>
  <div id="toasts"></div>
  <input type="file" id="fileOpen" accept=".vfx,.json" hidden>
  <input type="file" id="fileMidi" accept=".mid,.midi" hidden>
  <input type="file" id="fileAudio" accept="audio/*" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
