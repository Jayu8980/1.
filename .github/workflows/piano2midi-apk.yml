name: Piano2MIDI APK

on:
  push:
    paths:
      - 'piano2midi/android/**'
      - '.github/workflows/piano2midi-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: piano2midi/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build release APK (debug-signed)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: piano2midi-apk
          path: piano2midi/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
