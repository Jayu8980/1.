name: Piano2MIDI APK

on:
  push:
    paths:
      - 'piano2midi/android/**'
      - 'piano2midi/release/**'
      - '.github/workflows/piano2midi-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: piano2midi/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP installs missing platforms itself.
      - name: Build release APK (debug-signed)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: piano2midi-apk
          path: piano2midi/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # The signed arm64 APKs (343 MB standard, 1.27 GB Full) are too big for repository files,
  # so it is committed in parts under piano2midi/release/parts and published here as a
  # release asset. It keeps the signing key of the earlier releases, so it installs as an update.
  publish:
    if: github.ref == 'refs/heads/ccr-0beb1834-f8votw'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # one publisher at a time: parallel runs overwriting the same asset make the upload fail
    concurrency:
      group: piano2midi-release
      cancel-in-progress: false
    env:
      VERSION: '2.3'
    steps:
      - uses: actions/checkout@v4

      - name: Join and verify the APKs
        run: |
          for APK in Piano2MIDI-$VERSION-android-arm64.apk Piano2MIDI-Full-$VERSION-android-arm64.apk; do
            if ls piano2midi/release/parts/$APK.?? >/dev/null 2>&1; then
              cat piano2midi/release/parts/$APK.?? > $APK
              sha256sum -c piano2midi/release/$APK.sha256
            fi
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=piano2midi-v$VERSION
          STD=Piano2MIDI-$VERSION-android-arm64.apk
          FULL=Piano2MIDI-Full-$VERSION-android-arm64.apk
          NOTES="Android 8.0 to 16, arm64. Two separate apps, both with MuScriptor medium built in (no download needed):
          - $STD (343 MB): hFT-Transformer + MuScriptor medium (int8). SHA-256 $(cut -d' ' -f1 piano2midi/release/$STD.sha256)
          - $FULL (1.27 GB): Piano2MIDI Full, MuScriptor medium in full fp32 precision; installs next to the standard app. SHA-256 $(cut -d' ' -f1 piano2midi/release/$FULL.sha256 2>/dev/null)
          If a phone reports 'package appears to be invalid', use the 49 MB Piano2MIDI 2.2 from the repository (MuScriptor as an in-app download).
          MuScriptor weights: CC BY-NC 4.0 (non-commercial use only)."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Piano2MIDI $VERSION" --notes "$NOTES"
          else
            gh release edit "$TAG" --notes "$NOTES"
          fi
          for APK in $STD $FULL; do
            if [ -f "$APK" ]; then gh release upload "$TAG" "$APK" --clobber; fi
          done
