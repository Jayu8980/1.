name: Build TradeLens APK

on:
  push:
    branches: ["**"]
    paths: ["android-app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (indicators, charges, backtester, risk limits)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # Signing: add repository secrets KEYSTORE_BASE64 (base64 of your .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Without them a throwaway key is generated (fine for a first install, but updates need the SAME key).
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TRADELENS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "TRADELENS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "TRADELENS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret – signing with a temporary key"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias tradelens -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass temporary -keypass temporary -dname "CN=TradeLens, O=Personal, C=IN"
            echo "TRADELENS_KEYSTORE_PASSWORD=temporary" >> "$GITHUB_ENV"
            echo "TRADELENS_KEY_ALIAS=tradelens" >> "$GITHUB_ENV"
            echo "TRADELENS_KEY_PASSWORD=temporary" >> "$GITHUB_ENV"
          fi
          echo "TRADELENS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build signed release APK (arm64-v8a)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TradeLens-${{ env.VERSION_NAME }}-arm64
          path: android-app/app/build/outputs/apk/release/app-release.apk

  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r engine/requirements.txt -r relay-server/requirements.txt
      - run: cd engine && python -m pytest -q
      - run: cd relay-server && python -m pytest -q
