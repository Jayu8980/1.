name: Build AutoTube Agents APK

on:
  push:
    paths:
      - "youtube-agents/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-agents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/AutoTubeAgents-debug.apk
          cp app/build/outputs/apk/release/app-release.apk ../dist/AutoTubeAgents.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoTubeAgents-apk
          path: dist/*.apk

      - name: Publish to the "autotube-latest" release (downloadable from your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release view autotube-latest >/dev/null 2>&1 || \
            gh release create autotube-latest --title "AutoTube Agents (latest build)" \
              --notes "Latest APK built from ${GITHUB_REF_NAME}. Install AutoTubeAgents.apk on your Android phone." \
              --target "${GITHUB_SHA}" --prerelease
          gh release upload autotube-latest dist/AutoTubeAgents.apk dist/AutoTubeAgents-debug.apk --clobber
