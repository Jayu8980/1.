# ---------- Appium server ----------
appium.server.url=http://127.0.0.1:4723

# ---------- Device ----------
# Get the name from:  adb devices
platform.name=Android
automation.name=UiAutomator2
device.name=emulator-5554

# ---------- App ----------
# Option 1: install from an APK file (path is relative to the project folder)
app.path=apps/ApiDemos-debug.apk

# Option 2: open an app already installed on the phone
# (used only if app.path is empty)
app.package=io.appium.android.apis
app.activity=.ApiDemos

# ---------- Timeouts (seconds) ----------
explicit.wait=15
