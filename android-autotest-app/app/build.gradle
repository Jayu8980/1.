plugins {
    id 'com.android.application'
}

// Release signing: put your own keystore details in keystore.properties
// (see README). Without it, the release build falls back to the debug key.
def keystoreFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.automation.autotest'
    compileSdk 36                       // Android 16

    defaultConfig {
        applicationId 'com.automation.autotest'
        minSdk 30                       // Android 11 (needed for screenshots)
        targetSdk 36                    // Android 16
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
