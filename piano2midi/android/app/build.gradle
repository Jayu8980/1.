plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hft.piano2midi'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hft.piano2midi'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly.
            // Replace with your own signingConfig before publishing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        // keep the model stored so it can be memory-mapped / copied quickly
        noCompress 'onnx', 'sf2'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
}
