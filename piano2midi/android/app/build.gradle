plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hft.piano2midi'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hft.piano2midi'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '2.1'
        ndk {
            // -Pabis=arm64-v8a builds a single-ABI APK
            abiFilters.addAll((project.findProperty('abis') ?: 'arm64-v8a,armeabi-v7a,x86_64').toString().split(','))
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly.
            // Replace with your own signingConfig before publishing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        // keep the model stored so it can be memory-mapped / copied quickly
        noCompress 'onnx', 'sf2', 'bin'
    }

    // the MuScriptor model is stored in parts under piano2midi/models (GitHub's 100 MB file limit)
    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/muscriptor-assets"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

def msDir = file("$rootDir/../models/muscriptor-medium")
def msOut = file("$buildDir/generated/muscriptor-assets")
tasks.register('joinMuscriptorModel') {
    inputs.dir msDir
    outputs.dir msOut
    doLast {
        msOut.mkdirs()
        def parts = msDir.listFiles().findAll { it.name ==~ /muscriptor\.onnx\.\d\d/ }.sort { it.name }
        if (parts.isEmpty()) throw new GradleException("missing $msDir/muscriptor.onnx.NN")
        new File(msOut, 'muscriptor.onnx').withOutputStream { os -> parts.each { p -> p.withInputStream { os << it } } }
        copy { from new File(msDir, 'ms_frontend.bin'); into msOut }
    }
}
preBuild.dependsOn 'joinMuscriptorModel'

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
}
